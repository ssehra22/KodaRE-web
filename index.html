// Landing page sort: grouped by Service Category, following the category order set in
// Assumptions → Reference Lists (not alphabetically) — vendors with no category go last,
// and vendors within the same category are sorted alphabetically by name.
/* ===== Vendor insurance/license expiry alerting — reuses the same "expiring soon" window
   as Property Compliance (Assumptions -> Compliance Reminders -> "Expiring soon" window,
   ASSUMPTIONS.complianceExpiringDays) so there's one setting for "how far ahead do we want
   warned," not two. Insurance Expiry and License Expiry were previously just two plain date
   fields with no alerting at all - this adds a badge on each field in the vendor drawer, a
   summary column on the Vendor Directory list, and a toolbar count so an expiring vendor
   doesn't require opening every record to notice. */
function vendorExpiryStatus(dateStr){
  if(!dateStr||dateStr==='—')return 'none';
  const d=daysTo(dateStr);
  if(d==null||isNaN(d))return 'none';
  if(d<0)return 'expired';
  if(d<=ASSUMPTIONS.complianceExpiringDays)return 'warn';
  return 'ok';
}
function vendorFieldExpiryBadge(dateStr){
  const s=vendorExpiryStatus(dateStr);
  if(s==='expired')return '<span class="badge b-red"><span class="dot"></span>⚠ Expired</span>';
  if(s==='warn')return `<span class="badge b-assigned"><span class="dot"></span>⏳ Expires in ${daysTo(dateStr)}d</span>`;
  if(s==='ok')return '<span class="badge b-resolved"><span class="dot"></span>✓ Current</span>';
  return '';
}
function vendorExpiryWorst(v){
  const rank={none:0,ok:1,warn:2,expired:3};
  const insS=vendorExpiryStatus(v.insExp),licS=vendorExpiryStatus(v.licExp);
  return rank[insS]>=rank[licS]?insS:licS;
}
function vendorExpiryPill(v){
  const worst=vendorExpiryWorst(v);
  if(worst==='none')return '<span class="faint" style="font-size:12px">—</span>';
  const label={expired:'⚠ Expired',warn:'⏳ Expiring soon',ok:'✓ Current'}[worst];
  const color={expired:'red',warn:'amber',ok:'green'}[worst];
  const parts=[];
  const insS=vendorExpiryStatus(v.insExp),licS=vendorExpiryStatus(v.licExp);
  if(insS==='expired')parts.push('Insurance: expired');else if(insS==='warn')parts.push('Insurance: expires in '+daysTo(v.insExp)+'d');
  if(licS==='expired')parts.push('License: expired');else if(licS==='warn')parts.push('License: expires in '+daysTo(v.licExp)+'d');
  return `<span class="pill" title="${esc(parts.join(' · ')||'Both current')}" style="border-color:var(--${color});color:var(--${color})">${label}</span>`;
}
function vendorsExpiringCount(){return VENDORS.filter(v=>{const w=vendorExpiryWorst(v);return w==='expired'||w==='warn';}).length;}
function vendorsFiltered(){
  const catOrder=Object.keys(CAT);
  const catRank=(v)=>{const i=catOrder.indexOf(v.trade);return i===-1?catOrder.length:i;};
  return VENDORS.filter(v=>
    (VFILTER.trade==='all'||v.trade===VFILTER.trade) &&
    (VFILTER.primary==='all'||(VFILTER.primary==='__blank__'?!v.primary:v.primary===VFILTER.primary)) &&
    (VFILTER.metro==='all'||(VFILTER.metro==='__blank__'?!(v.metro&&v.metro.length):(v.metro||[]).includes(VFILTER.metro))) &&
    (!VFILTER.nameQuery||(v.name||'').toLowerCase().includes(VFILTER.nameQuery.toLowerCase())) &&
    (!VFILTER.contactQuery||(v.contact||'').toLowerCase().includes(VFILTER.contactQuery.toLowerCase())) &&
    (!VFILTER.emailQuery||(v.email||'').toLowerCase().includes(VFILTER.emailQuery.toLowerCase())) &&
    (!VFILTER.phoneQuery||(v.phone||'').toLowerCase().includes(VFILTER.phoneQuery.toLowerCase()))
  ).sort((a,b)=>{const r=catRank(a)-catRank(b);return r!==0?r:a.name.localeCompare(b.name);});
}

/* ===== reports & analytics (Scope §4.11) ===== */
let REPTAB='operational';
/* ===== Vendor spend — YTD and trailing-12-month, calculated from real ticket costs =====
   Fiscal year = calendar year (Jan 1). "Spend" is ambiguous on its own, so every place this
   number appears now labels it as one of these two, computed live — never a manually-typed
   figure that can go stale. */
function fyStart(){const d=new Date();return new Date(d.getFullYear(),0,1);}
function t12Start(){const d=new Date();d.setMonth(d.getMonth()-12);return d;}
function propertySpendStats(propId){
  const ts=TICKETS.filter(t=>t.prop===propId&&t.cost&&t.payment==='Paid');
  const fy=fyStart(),t12=t12Start();
  const ytd=ts.filter(t=>new Date(t.created)>=fy).reduce((s,t)=>s+t.cost,0);
  const trailing12=ts.filter(t=>new Date(t.created)>=t12).reduce((s,t)=>s+t.cost,0);
  return {ytd,t12:trailing12};
}
function vendorSpendStats(vendorName){
  const ts=TICKETS.filter(t=>t.vendor===vendorName&&t.cost&&t.payment==='Paid');
  const fy=fyStart(),t12=t12Start();
  const ytd=ts.filter(t=>new Date(t.created)>=fy).reduce((s,t)=>s+t.cost,0);
  const trailing12=ts.filter(t=>new Date(t.created)>=t12).reduce((s,t)=>s+t.cost,0);
  return {ytd,t12:trailing12,n:ts.length};
}
/* ===== CSV export / data dumps ===== */
function csvCell(v){
  if(v==null)return '';
  if(v instanceof Date)v=isNaN(v.getTime())?'':v.toISOString().slice(0,10);
  const s=String(v);
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function rowsToCSV(columns,rows){
  const head=columns.map(c=>csvCell(c.label)).join(',');
  const body=rows.map(r=>columns.map(c=>csvCell(typeof c.get==='function'?c.get(r):r[c.key])).join(',')).join('\n');
  return head+'\n'+body;
}
function downloadCSV(filename,csv){
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},0);
  toast('Downloaded '+filename);
}
/* Excel (Phase 30) — reuses the SheetJS lib already loaded for bulk-upload parsing. Same
   columns spec ({label,key} or {label,get}) that CSV export already uses, so every dataset and
   report gets Excel for free with no per-export-site changes. */
function downloadXLSX(filename,sheetName,columns,rows){
  const aoa=[columns.map(c=>c.label),...rows.map(r=>columns.map(c=>{
    const v=typeof c.get==='function'?c.get(r):r[c.key];return v==null?'':v;
  }))];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,(sheetName||'Sheet1').replace(/[\[\]:\\/?*]/g,' ').slice(0,31)||'Sheet1');
  XLSX.writeFile(wb,filename);
  toast('Downloaded '+filename);
}
/* PDF (Phase 30) — jsPDF + autotable, loaded via CDN alongside the existing SheetJS/Chart.js
   CDN scripts (same no-build-step approach as the rest of the app). Landscape for wider tables
   so columns don't get crushed. */
function downloadPDFTable(filename,title,columns,rows){
  if(!window.jspdf){toast('PDF export failed: PDF library did not load — check your connection and try again');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:columns.length>6?'landscape':'portrait',unit:'pt'});
  doc.setFontSize(14);doc.text(title||'KodaRE export',40,40);
  doc.setFontSize(9);doc.setTextColor(120);doc.text('Exported '+new Date().toLocaleString(),40,56);
  doc.autoTable({
    startY:68,
    head:[columns.map(c=>c.label)],
    body:rows.map(r=>columns.map(c=>{const v=typeof c.get==='function'?c.get(r):r[c.key];return v==null?'':String(v);})),
    styles:{fontSize:8,cellPadding:4,overflow:'linebreak'},
    headStyles:{fillColor:[30,41,59]},
    margin:{left:40,right:40}
  });
  doc.save(filename);
  toast('Downloaded '+filename);
}

function reportExportSpec(tab){
  if(tab==='operational')return {filename:'report_operational_tickets.csv',rows:TICKETS.filter(isOpen),columns:[
    {label:'Ref',get:t=>ticketRef(t)},{label:'Property',get:t=>(propById(t.prop)||{}).name||''},
    {label:'Title',key:'title'},{label:'Urgency',key:'urgency'},{label:'Status',key:'status'},
    {label:'Vendor',key:'vendor'},{label:'Cost',key:'cost'},{label:'Created',get:t=>t.created}]};
  if(tab==='maintspend')return {filename:'report_maintenance_spend.csv',rows:TICKETS.filter(t=>t.cost&&t.payment==='Paid'),columns:[
    {label:'Ref',get:t=>ticketRef(t)},{label:'Property',get:t=>(propById(t.prop)||{}).name||''},
    {label:'Category',key:'svc'},{label:'Vendor',key:'vendor'},{label:'Cost',key:'cost'},{label:'Created',get:t=>t.created}]};
  if(tab==='compliance')return {filename:'report_compliance.csv',rows:CERTS,columns:[
    {label:'Property',get:c=>(propById(c.prop)||{}).name||''},{label:'Type',key:'type'},
    {label:'Expires',get:c=>c.exp},{label:'Status',key:'status'}]};
  if(tab==='financial')return {filename:'report_financial_loans.csv',rows:PROPS.filter(p=>p.own==='owned'&&(p.loanLender||p.loanRemaining!=null)),columns:[
    {label:'Property',key:'name'},{label:'Lender',key:'loanLender'},{label:'Balance',key:'loanRemaining'},
    {label:'Payment',key:'loanPayment'},{label:'Maturity',key:'loanMaturity'}]};
  if(tab==='capital')return {filename:'report_capital_life_of_appliances.csv',rows:Object.keys(LIFE_TABLE).map(n=>({n,life:LIFE_TABLE[n][0],cost:LIFE_TABLE[n][1]})),columns:[
    {label:'Component',key:'n'},{label:'Avg lifespan (yrs)',key:'life'},{label:'Replacement cost',key:'cost'}]};
  return {filename:'report_executive_properties.csv',rows:PROPS,columns:[
    {label:'Name',key:'name'},{label:'Status',key:'status'},{label:'Health',key:'health'},{label:'Metro',key:'metro'}]};
}
/* ===== Reports access restriction — Scope §3.2 matrix row "Reports — financial / executive":
   Office Staff = no access, Senior Admin = R. Capital planning isn't a named matrix row, but
   it's the same kind of portfolio-value/forecast data, so it's locked down alongside the other
   two rather than left open by default (confirmed with Sonia, Aug 5, 2026 — see the RBAC audit
   for the original finding: these three tabs previously rendered identically for every role).
   Gated in three places for defense in depth: the tab list itself (so Office Staff never sees
   the tab), reportBody() (so directly setting REPTAB can't render restricted content either),
   and exportCurrentReport() (so the CSV export button can't be used on a restricted tab). */
const REPORTS_ADMIN_ONLY=['financial','capital','executive'];
function exportCurrentReport(format){
  if(REPORTS_ADMIN_ONLY.includes(REPTAB)&&ROLE!=='admin'){toast('Only Senior Admin can export this report');return;}
  const s=reportExportSpec(REPTAB);
  const labels={operational:'Operational report',maintspend:'Maintenance spend report',compliance:'Compliance report',
    financial:'Financial report',capital:'Capital planning report',executive:'Executive dashboard'};
  if(format==='xlsx')downloadXLSX(s.filename.replace(/\.csv$/,'.xlsx'),REPTAB,s.columns,s.rows);
  else if(format==='pdf')downloadPDFTable(s.filename.replace(/\.csv$/,'.pdf'),labels[REPTAB]||'KodaRE report',s.columns,s.rows);
  else downloadCSV(s.filename,rowsToCSV(s.columns,s.rows));
}
function renderReports(el){
  const allTabs=['operational','maintspend','compliance','financial','capital','executive','export'];
  const tabs=ROLE==='admin'?allTabs:allTabs.filter(t=>!REPORTS_ADMIN_ONLY.includes(t));
  if(REPORTS_ADMIN_ONLY.includes(REPTAB)&&ROLE!=='admin')REPTAB='operational';
  const labels={operational:'Operational',maintspend:'Maintenance spend',compliance:'Compliance',financial:'Financial',capital:'Capital planning',executive:'Executive dashboard',export:'Data export'};
  el.innerHTML=`${pageHeader('reports')}<div class="tabs" style="display:flex;align-items:center">${tabs.map(t=>`<button class="tab ${REPTAB===t?'active':''}" onclick="REPTAB='${t}';renderReports(document.getElementById('view'))">${labels[t]}</button>`).join('')}
    ${REPTAB!=='export'?`<div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn sec sm" onclick="exportCurrentReport('csv')">⬇ CSV</button>
      <button class="btn sec sm" onclick="exportCurrentReport('xlsx')">⬇ Excel</button>
      <button class="btn sec sm" onclick="exportCurrentReport('pdf')">⬇ PDF</button>
    </div>`:''}</div>
  <div id="repBody">${reportBody(REPTAB)}</div>`;
  if(REPTAB==='maintspend')renderMaintSpendCharts();
}

/* ===== maintenance spend charts (Chart.js — loaded via CDN, see <head>) ===== */
// Chart.js draws to a <canvas>, which can't resolve a live CSS var() — so these read the
// same design-system tokens once, at draw time, via getComputedStyle, rather than
// hardcoding their own copy of the palette.
function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function hexToRgba(hex,alpha){const h=hex.replace('#','');const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);return `rgba(${r},${g},${b},${alpha})`;}
const CHART_PALETTE=()=>[cssVar('--role-office'),cssVar('--role-admin'),cssVar('--role-field'),cssVar('--role-external'),cssVar('--role-leased'),cssVar('--tone-ok-solid-bg'),cssVar('--tone-warn-solid-bg'),cssVar('--tone-danger-solid-bg'),cssVar('--ink-500'),cssVar('--ink-400')];
let MSCHARTS={};
function destroyMSChart(key){if(MSCHARTS[key]){MSCHARTS[key].destroy();delete MSCHARTS[key];}}
function renderMaintSpendCharts(){
  if(typeof Chart==='undefined')return; // CDN unreachable — the detail tables below still show every figure
  ['chartPropSpend','chartMatrix','chartCatSpend','chartMonthly'].forEach(destroyMSChart);
  const priced=TICKETS.filter(t=>t.cost&&t.payment==='Paid');
  const propRows=PROPS.map(p=>{const ts=priced.filter(t=>t.prop===p.id);const spend=ts.reduce((s,t)=>s+t.cost,0);return {p,spend};}).sort((a,b)=>b.spend-a.spend);
  const catAgg={};priced.forEach(t=>{const k=t.svc||'Uncategorized';catAgg[k]=catAgg[k]||{n:0,spend:0};catAgg[k].n++;catAgg[k].spend+=t.cost;});
  const catRows=Object.entries(catAgg).map(([k,d])=>({k,spend:d.spend})).sort((a,b)=>b.spend-a.spend);
  const TOPN=7;
  const OTHER_KEY='__other_bucket__';
  const topCats=catRows.slice(0,TOPN).map(r=>r.k);
  const hasOther=catRows.length>TOPN;
  const matrixCats=hasOther?[...topCats,OTHER_KEY]:topCats;
  const _cp=CHART_PALETTE();const catColor={};matrixCats.forEach((c,i)=>catColor[c]=_cp[i%_cp.length]);

  const c1=document.getElementById('chartPropSpend');
  if(c1)MSCHARTS.chartPropSpend=new Chart(c1,{type:'bar',data:{labels:propRows.map(r=>r.p.name),datasets:[{label:'Maintenance spend',data:propRows.map(r=>r.spend),backgroundColor:cssVar('--accent'),borderRadius:4,maxBarThickness:22}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>money(ctx.parsed.x)}}},scales:{x:{ticks:{callback:v=>'$'+Number(v).toLocaleString()}},y:{grid:{display:false}}}}});

  const c2=document.getElementById('chartMatrix');

async function submitNewTicket(){
  const propEl=document.getElementById('nt_prop');
  const propId=propEl?propEl.value:'';
  const status=document.getElementById('nt_status').value||'Open';
  const createdRaw=(document.getElementById('nt_created').value||'').trim();
  const desc=(document.getElementById('nt_desc').value||'').trim();
  const urgency=document.getElementById('nt_urgency').value;
  const vendor=document.getElementById('nt_vendor').value;
  const costRaw=(document.getElementById('nt_cost').value||'').trim();
  const invoice=(document.getElementById('nt_invoice').value||'').trim();
  const payment=document.getElementById('nt_payment').value;
  // nt_reporter is a read-only field always populated from currentUserDisplayName() above —
  // this fallback exists only in case the element is ever missing, not as an editable default.
  const reporter=(document.getElementById('nt_reporter').value||'').trim()||currentUserDisplayName();
  const notes=(document.getElementById('nt_notes').value||'').trim();
  const errEl=document.getElementById('nt_error');
  errEl.textContent='';
  if(!propId){errEl.textContent='Choose a property.';return;}
  if(!desc){errEl.textContent='Add a short description.';return;}
  let cost=null;
  if(costRaw!==''){const n=Number(costRaw);if(isNaN(n)){errEl.textContent='Cost must be a number.';return;}cost=n;}
  let created=createdRaw?parseFlexDate(createdRaw):null;
  if(!created)created=new Date();
  const p=propById(propId);
  const title=desc.slice(0,60);

  // Service category/type are deliberately not set here — there's no field for them on this
  // form. They stay null until Office Staff or Senior Admin triages the ticket (svcSelect/
  // svcTypeSelect in the ticket drawer), same as a mobile-submitted report.
  if(p&&p._backend==='supabase'){
    const payload={property_id:propId,title,description:desc,notes,service_category:null,service_type:null,urgency,status,vendor:vendor||null,cost,invoice_number:invoice||null,payment_status:payment||null,reporter,created_at:created.toISOString(),created_by_email:await currentUserEmail()};
    const {data,error}=await sb.from('maintenance_tickets').insert(payload).select().single();
    if(error){errEl.textContent='Could not create ticket: '+error.message;return;}
    await dbLogActivity(data.id,'Logged','Entered in maintenance tracker');
    const t=rowToTicket(Object.assign({},data,{maintenance_ticket_activity:[{action:'Logged',detail:'Entered in maintenance tracker',created_at:new Date().toISOString()}]}));
    TICKETS.unshift(t);
    closeDrawer();
    toast('Ticket '+t.id+' created');
    refreshTickets();
    return;
  }
  const t=mkTicket({prop:propId,title,desc,notes,svc:null,svctype:null,urgency,status,vendor:vendor||null,cost,invoice:invoice||null,payment:payment||null,created,reporter,log:[['Logged','Entered in maintenance tracker',0]]});
  TICKETS.push(t);saveState();
  closeDrawer();
  toast('Ticket '+t.id+' created');
  refreshTickets();
}

/* ===== bulk ticket entry: in-app paste grid ===== */
const BULK_TICKET_HEADERS=['Property','Status','Created','Description','Priority','Service Category','Service Type','Vendor','Cost','Invoice','Payment','Reporter','Comments'];
let BULK_GRID=[];
function openBulkGrid(){
  BULK_GRID=Array.from({length:20},()=>BULK_TICKET_HEADERS.map(()=>''));
  document.getElementById('drawerRoot').innerHTML=bulkGridMarkup();
}
function bulkGridMarkup(){
  return `<div class="scrim" style="justify-content:center;align-items:center" onclick="if(event.target===this)closeDrawer()">
    <div style="background:var(--bg);width:96vw;max-width:1500px;height:92vh;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)">
      <div style="padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1"><div class="faint" style="font-size:12px">Maintenance</div><div style="font-size:19px;font-weight:800">Bulk add tickets</div>
        <div class="muted" style="font-size:12.5px;margin-top:4px">Type directly into cells, or copy a range from Excel or Google Sheets and paste anywhere in the grid — it fills starting from the cell you paste into.</div></div>
        <button class="x" onclick="closeDrawer()">✕</button>
      </div>
      <div style="flex:1;overflow:auto;padding:14px 20px" id="bulkGridWrap">${bulkGridTable()}</div>
      <div style="padding:12px 20px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center">
        <button class="btn sec sm" onclick="addBulkGridRows(10)">+ Add 10 rows</button>
        <span id="bulkGridMsg" class="muted" style="font-size:12.5px"></span>
        <button class="btn" style="margin-left:auto" onclick="importBulkGrid()">Import all</button>
      </div>
    </div>
  </div>`;
}
function bulkGridTable(){
  return `<table style="border-collapse:collapse;min-width:1550px">
    <thead><tr>${BULK_TICKET_HEADERS.map(h=>`<th style="position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);padding:6px 8px;font-size:11.5px;text-align:left;white-space:nowrap;z-index:1">${h}</th>`).join('')}</tr></thead>
    <tbody>${BULK_GRID.map((row,r)=>`<tr>${row.map((val,c)=>`<td style="border:1px solid var(--line);padding:0"><input value="${esc(val)}" oninput="setBulkCell(${r},${c},this.value)" onpaste="bulkGridPaste(event,${r},${c})" style="width:130px;border:0;padding:6px 8px;font-size:12.5px;background:transparent"></td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}
function setBulkCell(r,c,val){if(BULK_GRID[r])BULK_GRID[r][c]=val;}
function bulkGridPaste(event,r,c){
  const text=(event.clipboardData||window.clipboardData).getData('text');
  if(!text||(!text.includes('\t')&&!text.includes('\n')))return; // single-cell paste: let the browser handle it natively
  event.preventDefault();
  const lines=text.replace(/\r/g,'').split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
  lines.forEach((line,ri)=>{
    while(!BULK_GRID[r+ri])BULK_GRID.push(BULK_TICKET_HEADERS.map(()=>''));
    const cells=line.split('\t');
    cells.forEach((cell,ci)=>{
      const col=c+ci;
      if(col<BULK_TICKET_HEADERS.length)BULK_GRID[r+ri][col]=cell.trim();
    });
  });
  document.getElementById('bulkGridWrap').innerHTML=bulkGridTable();
}
function addBulkGridRows(n){
  for(let i=0;i<n;i++)BULK_GRID.push(BULK_TICKET_HEADERS.map(()=>''));
  document.getElementById('bulkGridWrap').innerHTML=bulkGridTable();
}
function importBulkGrid(){
  const rows=BULK_GRID.map(row=>{
    const obj={};
    BULK_TICKET_HEADERS.forEach((h,i)=>{obj[h]=row[i];});
    return obj;
  }).filter(obj=>Object.values(obj).some(v=>String(v||'').trim()!==''));
  if(!rows.length){const m=document.getElementById('bulkGridMsg');if(m)m.textContent='Nothing to import yet — fill in at least one row.';return;}
  closeDrawer();
  processBulkTicketRows(rows);
}
const TICKET_UPLOAD_FIELD_MAP={property:'prop',propertyname:'prop',status:'status',created:'created',createddate:'created',datecreated:'created',date:'created',description:'desc',title:'desc',issue:'desc',priority:'urgency',urgency:'urgency',servicecategory:'svc',category:'svc',servicetype:'svctype',type:'svctype',vendor:'vendor',cost:'cost',estimatedcost:'cost',invoice:'invoice',invoicenumber:'invoice',payment:'payment',paymentstatus:'payment',reporter:'reporter',notes:'notes',comments:'notes'};
function normHeaderKey(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function handleBulkUploadFile(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      processBulkTicketRows(rows);
    }catch(err){
      toast('Could not read that file: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.onerror=function(){toast('Could not read that file.');input.value='';};
  reader.readAsArrayBuffer(file);
}
async function processBulkTicketRows(rows){
  if(!rows||!rows.length){toast('That file has no rows to import.');return;}
  const plist=SUPA_CONFIGURED?PROPS.filter(p=>p._backend==='supabase'):PROPS;
  const STATUS_OPTS=['Open','In progress','Completed','Closed'];
  const URGENCY_OPTS=['Low','Urgent','Emergency'];
  const PAYMENT_OPTS=['Match Proposed','Ready for Payment','Paid'];
  const parsed=[],skipped=[];
  rows.forEach((row,i)=>{
    const f={};
    Object.keys(row).forEach(k=>{const mapped=TICKET_UPLOAD_FIELD_MAP[normHeaderKey(k)];if(mapped&&!(mapped in f))f[mapped]=row[k];});
    const rowNum=i+2;
    const propName=String(f.prop||'').trim();
    const desc=String(f.desc||'').trim();
    if(!propName){skipped.push('Row '+rowNum+': missing Property');return;}
    if(!desc){skipped.push('Row '+rowNum+': missing Description');return;}
    const prop=plist.find(p=>p.name.toLowerCase()===propName.toLowerCase());
    if(!prop){skipped.push('Row '+rowNum+': property "'+propName+'" not found');return;}
    let status=String(f.status||'').trim();
    status=STATUS_OPTS.find(s=>s.toLowerCase()===status.toLowerCase())||'Open';
    let urgency=String(f.urgency||'').trim();
    urgency=URGENCY_OPTS.find(u=>u.toLowerCase()===urgency.toLowerCase())||'Low';
    let payment=String(f.payment||'').trim();
    payment=PAYMENT_OPTS.find(p=>p.toLowerCase()===payment.toLowerCase())||null;
    let cost=null;
    if(f.cost!=null&&String(f.cost).trim()!==''){const n=Number(String(f.cost).replace(/[^0-9.\-]/g,''));if(!isNaN(n))cost=n;}
    let created=null;
    if(f.created){
      let d;
      if(f.created instanceof Date)d=f.created;
      else{const s=String(f.created).trim();d=/^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T00:00:00'):new Date(s);}
      if(!isNaN(d))created=d;
    }
    let svc=String(f.svc||'').trim()||null;
    let svctype=String(f.svctype||'').trim()||null;
    const vendorName=String(f.vendor||'').trim()||null;
    if(vendorName){
      // Vendor Directory's Service Category (Default) / Service Type (Default) fill in any
      // category/type left blank on the import row — an explicit value on the row still wins.
      const vend=VENDORS.find(x=>x.name.toLowerCase()===vendorName.toLowerCase());
      if(vend){if(!svc&&vend.trade)svc=vend.trade;if(!svctype&&vend.svctype)svctype=vend.svctype;}
    }
    parsed.push({prop,status,urgency,svc,svctype,vendor:vendorName,cost,invoice:String(f.invoice||'').trim()||null,payment,reporter:String(f.reporter||'').trim()||currentUserDisplayName(),notes:String(f.notes||'').trim(),desc,title:desc.slice(0,60),created});
  });
  if(!parsed.length){alert('No rows could be imported.'+(skipped.length?'\n\n'+skipped.join('\n'):''));return;}
  let created=0;
  const liveRows=parsed.filter(r=>r.prop._backend==='supabase');
  const demoRows=parsed.filter(r=>r.prop._backend!=='supabase');
  if(liveRows.length){
    const uploaderEmail=await currentUserEmail();
    const payloads=liveRows.map(r=>{const payload={property_id:r.prop.id,title:r.title,description:r.desc,notes:r.notes,status:r.status,urgency:r.urgency,service_category:r.svc,service_type:r.svctype,vendor:r.vendor,cost:r.cost,invoice_number:r.invoice,payment_status:r.payment,reporter:r.reporter,created_by_email:uploaderEmail};if(r.created)payload.created_at=r.created.toISOString();return payload;});
    const {data,error}=await sb.from('maintenance_tickets').insert(payloads).select();
    if(error){toast('Bulk import failed: '+error.message);return;}
    for(const row of data){
      await dbLogActivity(row.id,'Logged','Entered via bulk upload');
      TICKETS.unshift(rowToTicket(Object.assign({},row,{maintenance_ticket_activity:[{action:'Logged',detail:'Entered via bulk upload',created_at:new Date().toISOString()}]})));
      created++;
    }
  }
  if(demoRows.length){
    demoRows.forEach(r=>{
      const t=mkTicket({prop:r.prop.id,title:r.title,desc:r.desc,notes:r.notes,svc:r.svc,svctype:r.svctype,urgency:r.urgency,status:r.status,vendor:r.vendor,cost:r.cost,invoice:r.invoice,payment:r.payment,reporter:r.reporter,created:r.created||new Date(today),log:[['Logged','Entered via bulk upload',0]]});
      TICKETS.push(t);
      created++;
    });
    saveState();
  }
  refreshTickets();
  let msg=created+' ticket'+(created===1?'':'s')+' imported.';
  if(skipped.length)msg+=' '+skipped.length+' row'+(skipped.length===1?'':'s')+' skipped.';
  toast(msg);
  if(skipped.length)alert('Skipped rows:\n\n'+skipped.join('\n'));
}

async function submitNewVendor(){

  const name=g('nv_name').trim();
  const errEl=document.getElementById('nv_error');if(errEl)errEl.textContent='';
  if(!name){if(errEl)errEl.textContent='Enter a vendor name.';return;}
  const trade=(ROLE==='admin'?g('nv_trade'):'')||null;
  const svctype=(ROLE==='admin'?g('nv_svctype'):'')||null;

  const licenses=g('nv_licenses').trim()||null;

  const ytdRaw=g('nv_ytd').trim();

  const comments=g('nv_comments').trim()||null;
  const userNotes=g('nv_usernotes').trim()||null;
  const properties=g('nv_properties').trim()||null;

  if(SUPA_CONFIGURED){
    const payload={name,trade,service_type:svctype,metro,primary_secondary:primary,pricing,after_hours:afterHours,
      contact,phone,email,portal,login,licenses,lic_exp:licExpDate?toISODate(licExpDate):null,
      ins_exp:insExpDate?toISODate(insExpDate):null,referred_by:referredBy,quality,ytd,comments,user_notes:userNotes,properties};
    const {data,error}=await sb.from('vendors').insert(payload).select().single();

    licenses,licExp:licExpDate?toISODate(licExpDate):null,insExp:insExpDate?toISODate(insExpDate):null,referredBy,quality,
    ytd,comments,userNotes,properties};
  VENDORS.push(v);saveState();
  closeDrawer();

}

function setBulkVendorCell(r,c,val){if(BULK_VENDOR_GRID[r])BULK_VENDOR_GRID[r][c]=val;}
function bulkVendorGridPaste(event,r,c){
  const text=(event.clipboardData||window.clipboardData).getData('text');
  if(!text||(!text.includes('\t')&&!text.includes('\n')))return;
  event.preventDefault();
  const lines=text.replace(/\r/g,'').split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
  lines.forEach((line,ri)=>{
    while(!BULK_VENDOR_GRID[r+ri])BULK_VENDOR_GRID.push(BULK_VENDOR_HEADERS.map(()=>''));
    const cells=line.split('\t');
    cells.forEach((cell,ci)=>{
      const col=c+ci;
      if(col<BULK_VENDOR_HEADERS.length)BULK_VENDOR_GRID[r+ri][col]=cell.trim();
    });
  });
  document.getElementById('bulkVendorGridWrap').innerHTML=bulkVendorGridTable();
}

  for(let i=0;i<n;i++)BULK_VENDOR_GRID.push(BULK_VENDOR_HEADERS.map(()=>''));

const VENDOR_UPLOAD_FIELD_MAP={vendor:'name',vendorname:'name',name:'name',metro:'metro',servicecategory:'trade',category:'trade',
  servicetype:'svctype',type:'svctype',primarysecondary:'primary',primary:'primary',pricing:'pricing',
  afterhoursservice:'afterHours',afterhours:'afterHours',contactname:'contact',contact:'contact',phone:'phone',phonenumber:'phone',
  email:'email',portalwebsite:'portal',portal:'portal',website:'portal',logininfo:'login',login:'login',

function handleBulkVendorUploadFile(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      processBulkVendorRows(rows);
    }catch(err){
      toast('Could not read that file: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.onerror=function(){toast('Could not read that file.');input.value='';};
  reader.readAsArrayBuffer(file);
}
function bulkParseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v.getTime())?null:toISODate(v);
  const s=String(v).trim();
  const mdyy=parseMDYY(s);if(mdyy)return toISODate(mdyy);
  const d=/^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T00:00:00'):new Date(s);
  return isNaN(d.getTime())?null:toISODate(d);
}
async function processBulkVendorRows(rows){
  if(!rows||!rows.length){toast('That file has no rows to import.');return;}
  const parsed=[],skipped=[];
  rows.forEach((row,i)=>{
    const f={};
    Object.keys(row).forEach(k=>{const mapped=VENDOR_UPLOAD_FIELD_MAP[normHeaderKey(k)];if(mapped&&!(mapped in f))f[mapped]=row[k];});
    const rowNum=i+2;
    const name=String(f.name||'').trim();
    if(!name){skipped.push('Row '+rowNum+': missing Vendor name');return;}
    let ytd=0;
    if(f.ytd!=null&&String(f.ytd).trim()!==''){const n=Number(String(f.ytd).replace(/[^0-9.\-]/g,''));if(!isNaN(n))ytd=n;}
    const trade=(ROLE==='admin')?(String(f.trade||'').trim()||null):null;
    const svctype=(ROLE==='admin')?(String(f.svctype||'').trim()||null):null;
    parsed.push({name,metro:String(f.metro||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean),trade,svctype,primary:String(f.primary||'').trim()||null,
      pricing:String(f.pricing||'').trim()||null,afterHours:String(f.afterHours||'').trim()||null,
      contact:String(f.contact||'').trim()||null,phone:String(f.phone||'').trim()||null,email:String(f.email||'').trim()||null,
      portal:String(f.portal||'').trim()||null,login:String(f.login||'').trim()||null,
      insExp:bulkParseDate(f.insExp),licenses:String(f.licenses||'').trim()||null,licExp:bulkParseDate(f.licExp),
      referredBy:String(f.referredBy||'').trim()||null,quality:String(f.quality||'').trim()||null,ytd,
      comments:String(f.comments||'').trim()||null,userNotes:String(f.userNotes||'').trim()||null,properties:String(f.properties||'').trim()||null});
  });
  if(!parsed.length){alert('No rows could be imported.'+(skipped.length?'\n\n'+skipped.join('\n'):''));return;}
  let created=0;
  if(SUPA_CONFIGURED){
    const payloads=parsed.map(r=>({name:r.name,metro:r.metro,trade:r.trade,service_type:r.svctype,primary_secondary:r.primary,
      pricing:r.pricing,after_hours:r.afterHours,contact:r.contact,phone:r.phone,email:r.email,portal:r.portal,login:r.login,
      ins_exp:r.insExp,licenses:r.licenses,lic_exp:r.licExp,referred_by:r.referredBy,quality:r.quality,ytd:r.ytd,
      comments:r.comments,user_notes:r.userNotes,properties:r.properties}));
    const {data,error}=await sb.from('vendors').insert(payloads).select();
    if(error){toast('Bulk import failed: '+error.message);return;}
    data.forEach(row=>{VENDORS.push(rowToVendor(row));created++;});
  }else{
    parsed.forEach(r=>{
      VENDORS.push({id:'v'+Date.now()+Math.random().toString(36).slice(2,6),name:r.name,trade:r.trade,svctype:r.svctype,
        ytd:r.ytd,primary:r.primary,pricing:r.pricing,area:null,metro:r.metro,afterHours:r.afterHours,contact:r.contact,
        phone:r.phone,email:r.email,portal:r.portal,login:r.login,licenses:r.licenses,licExp:r.licExp,insExp:r.insExp,
        referredBy:r.referredBy,quality:r.quality,comments:r.comments,userNotes:r.userNotes,properties:r.properties});
      created++;
    });
    saveState();
  }
  if(VIEW==='vendors')renderVendors(document.getElementById('view'));
  let msg=created+' vendor'+(created===1?'':'s')+' imported.';

/* ===== persistence ===== */
const LSKEY='kodare_proto_v03_r1';
function saveState(){try{const snap={PROPS,VENDORS,LEASES,RECON,TID,NOTES,NOTEID,DOCS,DOC_ID,LIFE_TABLE,ASSUMPTIONS,CAT,SVC_TYPES,REF_LISTS};if(!SUPA_CONFIGURED){snap.TICKETS=TICKETS;snap.TRASH=TRASH;snap.TICKET_USER_NOTES=TICKET_USER_NOTES;}localStorage.setItem(LSKEY,JSON.stringify(snap));}catch(e){}}
function mergeById(defaults,saved,idKey){const map={};defaults.forEach(d=>map[d[idKey]]=Object.assign({},d));
  saved.forEach(s=>{const k=s[idKey];if(map[k])Object.assign(map[k],s);else map[k]=s;});
  return Object.values(map);}
function loadState(){try{const raw=localStorage.getItem(LSKEY);if(!raw)return false;const s=JSON.parse(raw);
  // Merge (rather than overwrite) so new sample properties/vendors/fields added later in the
  // prototype's source always show up, even if a browser has older saved state under this key.
  // Tickets are skipped entirely once live (SUPA_CONFIGURED) — they come from Supabase instead.
  if(!SUPA_CONFIGURED){
    const savedTickets=(s.TICKETS||[]).map(t=>Object.assign({},t,{created:new Date(t.created)}));
    const mergedTickets=mergeById(TICKETS,savedTickets,'id');TICKETS.length=0;mergedTickets.forEach(t=>TICKETS.push(t));
    TRASH.length=0;(s.TRASH||[]).forEach(x=>TRASH.push(x));
    TICKET_USER_NOTES.length=0;(s.TICKET_USER_NOTES||[]).forEach(n=>TICKET_USER_NOTES.push(Object.assign({},n,{updatedAt:n.updatedAt?new Date(n.updatedAt):new Date()})));
  }
  const mergedProps=mergeById(PROPS,s.PROPS||[],'id');PROPS.length=0;mergedProps.forEach(p=>PROPS.push(p));
  const mergedVendors=mergeById(VENDORS,s.VENDORS||[],'name');VENDORS.length=0;mergedVendors.forEach(v=>VENDORS.push(v));
  const savedLeases=(s.LEASES||[]).map(l=>Object.assign({},l,{next:l.next?new Date(l.next):l.next}));
  const mergedLeases=mergeById(LEASES,savedLeases,'id');LEASES.length=0;mergedLeases.forEach(l=>LEASES.push(l));
  const savedDocs=(s.DOCS||[]).map(x=>Object.assign({},x,{uploaded:new Date(x.uploaded)}));
  const mergedDocs=mergeById(DOCS,savedDocs,'id');DOCS.length=0;mergedDocs.forEach(x=>DOCS.push(x));
  if(s.DOC_ID)DOC_ID=s.DOC_ID;
  if(s.RECON){RECON.weekly=s.RECON.weekly;RECON.monthly=s.RECON.monthly;}if(s.NOTES)NOTES=s.NOTES;if(s.NOTEID)NOTEID=s.NOTEID;
  if(s.TID)TID=s.TID;
  if(s.LIFE_TABLE)Object.keys(s.LIFE_TABLE).forEach(k=>{if(LIFE_TABLE[k])LIFE_TABLE[k]=s.LIFE_TABLE[k];});
  if(s.ASSUMPTIONS)Object.keys(s.ASSUMPTIONS).forEach(k=>{if(k in ASSUMPTIONS)ASSUMPTIONS[k]=s.ASSUMPTIONS[k];});
  // Additive merges (same convention as LIFE_TABLE/ASSUMPTIONS above): overlay saved custom
  // values on top of the current hardcoded defaults, never delete a hardcoded default just
  // because an older saved snapshot predates it — otherwise expanding these lists in source
  // would get silently undone for anyone who already has local state saved.
  // 2026-07: Service Category/Type were curated down to a single clean canonical list per Scope v0.8
  // (see CAT/SVC_TYPES above) — strip the specific old near-duplicates a browser might still have saved
  // from before that cleanup, so they don't get re-merged back in below.
  const DEPRECATED_CAT=['Handyman','Electrical','Outdoor lawn/snow','Structural','Safety','Outdoor Roof/Gutter','Other/Miscel','Outdoor Lawn/Snow','Appliances','Furniture/Cabinets'];
  const DEPRECATED_SVC_TYPES=['Routine/Prevent.'];
  // Order-preserving merges: Reference Lists items can now be reordered (see move* functions), so a saved
  // snapshot's key/array order must win for anything already in it — only append hardcoded defaults the
  // saved snapshot predates, at the end, rather than always following hardcoded order.
  if(s.CAT){
    DEPRECATED_CAT.forEach(k=>delete s.CAT[k]);
    const merged={};Object.keys(s.CAT).forEach(k=>{merged[k]=s.CAT[k];});
    Object.keys(CAT).forEach(k=>{if(!(k in merged))merged[k]=CAT[k];});
    Object.keys(CAT).forEach(k=>delete CAT[k]);
    Object.keys(merged).forEach(k=>{CAT[k]=merged[k];});
  }
  if(Array.isArray(s.SVC_TYPES)){
    const merged=s.SVC_TYPES.filter(v=>!DEPRECATED_SVC_TYPES.includes(v));
    SVC_TYPES.forEach(v=>{if(!merged.includes(v))merged.push(v);});
    SVC_TYPES.length=0;merged.forEach(v=>SVC_TYPES.push(v));
  }
  if(s.REF_LISTS)Object.keys(s.REF_LISTS).forEach(k=>{
    if(REF_LISTS[k]&&Array.isArray(s.REF_LISTS[k].values)){
      const merged=s.REF_LISTS[k].values.slice();
      REF_LISTS[k].values.forEach(v=>{if(!merged.includes(v))merged.push(v);});
      REF_LISTS[k].values=merged;
    }
  });
  return true;}catch(e){return false;}}

function openOnboard(){const s=OB.step,d=OB.d;const prog=`<div class="progress" style="margin-bottom:16px"><i style="width:${(s+1)/4*100}%"></i></div>`;let body='';
  if(s===0)body=`<div class="sectitle">Step 1 · Acquisition type</div><div class="row"><div class="card" style="flex:1;cursor:pointer;${d.own==='owned'?'box-shadow:0 0 0 2px var(--sys)':''}" onclick="obSet('own','owned')"><div class="body"><div style="font-size:26px">🏠</div><div class="b">Purchase (Owned)</div><div class="muted" style="font-size:12.5px">Flow A — purchase. Held in an LLC.</div></div></div><div class="card" style="flex:1;cursor:pointer;${d.own==='leased'?'box-shadow:0 0 0 2px var(--ten)':''}" onclick="obSet('own','leased')"><div class="body"><div style="font-size:26px">📄</div><div class="b">Lease (Leased)</div><div class="muted" style="font-size:12.5px">Flow B — lease from a landlord.</div></div></div></div><div style="margin-top:18px">${d.own?`<button class="btn" onclick="obNext()">Continue →</button>`:`<button class="btn" disabled style="opacity:.5">Choose a type first</button>`}</div>`;
  else if(s===1)body=`<div class="sectitle">Step 2 · Basics</div><div class="field"><label class="f">Property name</label><input type="text" id="ob_name" value="${d.name||''}" placeholder="e.g. Sycamore House" style="width:100%"></div><div class="field"><label class="f">Address</label><input type="text" id="ob_addr" value="${d.addr||''}" placeholder="123 Sycamore St, City ST" style="width:100%"></div><div class="field"><label class="f">Beds</label><input type="text" id="ob_beds" value="${d.beds||''}" placeholder="e.g. 4" style="width:120px"></div><div style="display:flex;gap:10px"><button class="btn sec" onclick="obCapture(1);obBack()">← Back</button><button class="btn" onclick="obCapture(1);obNext()">Continue →</button></div>`;
  else if(s===2)body=`<div class="sectitle">Step 3 · ${d.own==='owned'?'Ownership':'Lease terms'}</div>${d.own==='owned'?`<div class="field"><label class="f">Holding LLC</label><input type="text" id="ob_llc" value="${d.llc||''}" placeholder="e.g. Sycamore Holdings LLC" style="width:100%"></div><div class="field"><label class="f">Purchase price ($)</label><input type="text" id="ob_val" value="${d.value||''}" placeholder="e.g. 350000" style="width:220px"></div>`:`<div class="field"><label class="f">Landlord</label><input type="text" id="ob_land" value="${d.landlord||''}" placeholder="e.g. Riverside Rentals" style="width:100%"></div><div class="field"><label class="f">Monthly rent ($)</label><input type="text" id="ob_rent" value="${d.rent||''}" placeholder="e.g. 3000" style="width:220px"></div>`}<div style="display:flex;gap:10px"><button class="btn sec" onclick="obCapture(2);obBack()">← Back</button><button class="btn" onclick="obCapture(2);obNext()">Continue →</button></div>`;
  else{const p=d;body=`<div class="sectitle">Step 4 · Review</div><div class="card"><div class="body"><div class="kv"><div class="k">Type</div><div class="b">${p.own==='owned'?'Owned (Flow A)':'Leased (Flow B)'}</div><div class="k">Name</div><div class="b">${p.name||'—'}</div><div class="k">Address</div><div>${p.addr||'—'}</div><div class="k">Beds</div><div>${p.beds||'—'}</div>${p.own==='owned'?`<div class="k">LLC</div><div>${p.llc||'—'}</div><div class="k">Value</div><div>${p.value?money(+p.value):'—'}</div>`:`<div class="k">Landlord</div><div>${p.landlord||'—'}</div><div class="k">Rent</div><div>${p.rent?money(+p.rent)+'/mo':'—'}</div>`}</div></div></div><div class="muted" style="font-size:12.5px;margin:10px 0">Created with status <b>New Transaction</b>.</div><div style="display:flex;gap:10px"><button class="btn sec" onclick="obBack()">← Back</button><button class="btn green" onclick="obCreate()">Create property ✓</button></div>`;}
  drawer(`<div style="flex:1"><div class="faint" style="font-size:12px">Properties · ${d.own==='owned'?'Flow A':d.own==='leased'?'Flow B':'new'}</div><div style="font-size:19px;font-weight:800">New property</div></div>`,prog+body);}
async function obCreate(){
  const d=OB.d;
  if(SUPA_CONFIGURED){
    const payload={name:d.name||'New Property',addr:d.addr||'',own:d.own,beds:parseInt(d.beds)||null,status:'New Transaction'};
    if(d.own==='owned'){payload.llc=d.llc||null;payload.value=parseInt(d.value)||null;}
    else{payload.landlord=d.landlord||null;payload.rent=parseInt(d.rent)||null;}
    const {data,error}=await sb.from('properties').insert(payload).select().single();
    if(error){toast('Could not create property: '+error.message);return;}
    const p=rowToProperty(data);
    PROPS.push(p);
    if(d.own!=='owned'){
      const {data:leaseRow,error:leaseErr}=await sb.from('leases').insert({property_id:p.id,landlord:p.landlord,rent:p.rent,term:'12 mo',status:'New Transaction',escalated:false}).select().single();
      if(!leaseErr)LEASES.push(rowToLease(leaseRow));
    }
    closeDrawer();toast('Property created: '+p.name);navigate('properties');
    return;
  }
  const p={id:'p'+Date.now(),name:d.name||'New Property',addr:d.addr||'',own:d.own,beds:parseInt(d.beds)||null,status:'New Transaction',health:'amber',compliance:null};if(d.own==='owned'){p.llc=d.llc||'—';p.value=parseInt(d.value)||null;p.rent=null;}else{p.landlord=d.landlord||'—';p.rent=parseInt(d.rent)||null;LEASES.push({id:p.id,prop:p.id,landlord:p.landlord,rent:p.rent,term:'12 mo',start:'—',end:'—',next:new Date(today),status:'New Transaction',escalated:false});}PROPS.push(p);saveState();closeDrawer();toast('Property created: '+p.name);navigate('properties');}

/* ===== boot ===== */
document.getElementById('switch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setRole(b.dataset.role);});
loadState();computeHealth();setRole('office');
if(sessionStorage.getItem('koda_idle_signout')){
  sessionStorage.removeItem('koda_idle_signout');
  setTimeout(()=>toast('Signed out due to inactivity — sign back in to continue'),300);
}
initLiveMode();

</script>
</body>
</html>
