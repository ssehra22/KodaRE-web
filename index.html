<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KodaRE — Interactive Prototype</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --panel2:#f4f6f9; --line:#dce3ec;
    --ink:#15202b; --muted:#5a6a7c; --faint:#8a99aa;
    --cg:#0e9aa3; --os:#2563c9; --sa:#7c3fd6; --sys:#1f9d40; --ext:#d2701a; --ten:#c2306f;
    --red:#cf3a32; --amber:#c9880c; --green:#1f9d40; --blue:#2563c9;
    --shadow:0 1px 3px rgba(20,40,70,.10),0 6px 24px rgba(20,40,70,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  a{color:var(--os);text-decoration:none}
  .hidden{display:none !important}

  /* ---- prototype top bar / switcher ---- */
  .protobar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
    background:#0f1722;color:#fff;padding:8px 16px}
  .protobar .brand{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .protobar .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--os),var(--sa));
    display:flex;align-items:center;justify-content:center;font-size:13px}
  .protobar .tag{font-size:11px;color:#9fb0c4;border:1px solid #2a3a4d;border-radius:999px;padding:2px 9px}
  .switch{margin-left:auto;display:flex;gap:6px;background:#1b2836;border-radius:10px;padding:4px}
  .switch button{background:transparent;border:0;color:#b7c5d6;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .switch button.active{background:#fff;color:#0f1722}
  .switch button .rc{width:9px;height:9px;border-radius:50%}

  /* ---- desktop app shell ---- */
  #desktop{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 41px)}
  .side{background:#101a27;color:#c7d2df;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
  .side .who{display:flex;align-items:center;gap:10px;padding:8px 8px 14px;border-bottom:1px solid #22303f;margin-bottom:10px}
  .side .avatar{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .side .who .nm{font-weight:700;color:#fff;font-size:13px}
  .side .who .rl{font-size:11px;color:#8ea0b4}
  .nav{background:transparent;border:0;color:#c7d2df;text-align:left;border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600}
  .nav .ic{width:20px;text-align:center;font-size:15px}
  .nav .ct{margin-left:auto;font-size:11px;background:#22303f;border-radius:999px;padding:1px 8px;color:#9fb2c6}
  .nav:hover{background:#1a2634;color:#fff}
  .nav.active{background:linear-gradient(90deg,rgba(37,99,201,.28),rgba(124,63,214,.18));color:#fff;box-shadow:inset 3px 0 0 var(--os)}
  .side .foot{margin-top:auto;font-size:11px;color:#6f8296;padding:10px 8px 0;border-top:1px solid #22303f}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:41px;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px}
  .topbar h1{font-size:18px;margin:0}
  .topbar .crumb{color:var(--faint);font-size:12.5px}
  .search{margin-left:auto;position:relative}
  .search input{border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 32px;width:250px;background:var(--panel2);font:inherit}
  .search .mag{position:absolute;left:10px;top:8px;color:var(--faint)}
  .content{padding:22px 24px 60px;max-width:1600px;width:100%}

  /* ---- generic components ---- */
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .kpi .val{font-size:27px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
  .kpi .sub{font-size:12px;color:var(--faint)}
  .kpi.red .val{color:var(--red)} .kpi.amber .val{color:var(--amber)} .kpi.green .val{color:var(--green)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .card h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;align-items:center;gap:10px}
  .card h3 .link{margin-left:auto;font-size:12.5px;font-weight:600}
  .card .body{padding:14px 16px}
  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
  .grid-props{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr.clickable:hover{background:var(--panel2);cursor:pointer}
  tbody tr:last-child td{border-bottom:0}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid transparent;white-space:nowrap}
  .b-new{background:#eaf0fb;color:#1d4ea0;border-color:#cfe0fb}
  .b-triage{background:#eef4fd;color:#1d4ea0;border-color:#d7e6fb}
  .b-assigned{background:#fff4e6;color:#a8550f;border-color:#f6ddbb}
  .b-progress{background:#fef7e0;color:#8a610a;border-color:#f2e4a8}
  .b-parts{background:#f0ecfb;color:#5a2ca6;border-color:#ddd0f6}
  .b-resolved{background:#eaf7ee;color:#157032;border-color:#c4e8ce}
  .b-closed{background:#eef1f5;color:#5a6a7c;border-color:#dce3ec}
  .b-red{background:#fdecea;color:#b02f28;border-color:#f6cfcb}
  .u-emergency{background:#fdecea;color:#b02f28;border-color:#f3b7b1}
  .u-high{background:#fff4e6;color:#a8550f;border-color:#f6d3a6}
  .u-normal{background:#eef1f5;color:#5a6a7c;border-color:#dce3ec}
  .u-low{background:#f4f6f9;color:#8a99aa;border-color:#e6ebf1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .dotc{width:8px;height:8px;border-radius:50%;display:inline-block}
  .owned{color:var(--sys)} .leased{color:var(--ten)}

  .btn{background:var(--os);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(1.06)}
  .btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--os);padding:6px 10px}
  .btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.amber{background:var(--amber)} .btn.purple{background:var(--sa)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  select,input[type=text],textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);color:var(--ink)}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
  .field{margin-bottom:14px}

  .sectitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:800;margin:22px 0 10px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(15,23,34,.42);z-index:60;display:flex;justify-content:flex-end}
  .drawer{width:560px;max-width:94vw;background:var(--bg);height:100%;overflow:auto;box-shadow:-8px 0 40px rgba(0,0,0,.2);animation:slide .18s ease}
  @keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
  .drawer .dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}
  .drawer .dhead .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:16px;color:var(--muted)}
  .drawer .dbody{padding:18px 20px}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:5px}
  .timeline li:last-child{border-left-color:transparent}
  .timeline li .tdot{position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--os);border:2px solid #fff}
  .timeline li .tt{font-weight:700;font-size:13px}
  .timeline li .tm{font-size:12px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}
  .kv .k{color:var(--muted)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{background:transparent;border:0;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tab.active{color:var(--os);border-bottom-color:var(--os)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:90;box-shadow:var(--shadow);animation:pop .2s ease}
  @keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--os);border-radius:99px}
  .avatarsm{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:11px}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .b{font-weight:700} .right{text-align:right} .mono{font-variant-numeric:tabular-nums}

  /* ---- mobile ---- */
  #mobile{display:flex;justify-content:center;padding:26px 12px 60px;background:
    radial-gradient(1200px 400px at 50% -160px, #dbe3ee, transparent);min-height:calc(100vh - 41px)}
  .phone{width:390px;max-width:96vw;height:820px;max-height:86vh;background:#0b1220;border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(15,23,34,.4);position:relative}
  .screen{background:#f2f5f9;border-radius:34px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .statusbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;color:#0b1220;flex:0 0 auto}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0b1220;border-radius:0 0 16px 16px;z-index:5}
  .mhead{background:linear-gradient(135deg,var(--cg),#0b7b83);color:#fff;padding:12px 18px 16px;flex:0 0 auto}
  .mhead .hi{font-size:12.5px;opacity:.9}
  .mhead .nm{font-size:19px;font-weight:800}
  .mbody{flex:1;overflow:auto;padding:16px}
  .mnav{flex:0 0 auto;display:flex;border-top:1px solid #e2e8f0;background:#fff}
  .mnav button{flex:1;background:transparent;border:0;padding:9px 0 12px;font-size:10.5px;font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
  .mnav button .mi{font-size:19px}
  .mnav button.active{color:var(--cg)}
  .mcard{background:#fff;border:1px solid #e6ecf3;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,40,70,.05)}
  .bigbtn{width:100%;background:linear-gradient(135deg,var(--cg),#0b7b83);color:#fff;border:0;border-radius:16px;padding:18px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px rgba(14,154,163,.35)}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:1.5px solid #e2e8f0;background:#fff;border-radius:14px;padding:14px 10px;font-weight:700;font-size:13px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--ink)}
  .opt .oi{font-size:22px}
  .opt.sel{border-color:var(--cg);background:#e9f7f8;color:#0b7b83}
  .mstep{font-size:11px;font-weight:800;color:var(--cg);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .mtitle{font-size:20px;font-weight:800;margin:0 0 14px}
  .mfield{margin-bottom:14px}
  .mfield label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .mfield input,.mfield textarea,.mfield select{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;font:inherit;background:#fff}
  .photo{border:2px dashed #cbd6e2;border-radius:14px;padding:22px;text-align:center;color:var(--faint);font-weight:700}
  .mrow{display:flex;justify-content:space-between;align-items:center;gap:10px}

  @media(max-width:900px){
    #desktop{grid-template-columns:1fr}
    .side{flex-direction:row;flex-wrap:wrap;align-items:center;min-height:unset}
    .side .who,.side .foot{display:none}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid2,.grid-props{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="protobar">
  <div class="brand"><span class="dot">K</span> KodaRE <span class="tag">Interactive Prototype · v0.3 · build jul 20, 6:05pm</span></div>
  <div class="switch" id="switch">
    <button data-role="office" class="active"><span class="rc" style="background:var(--os)"></span>Office Staff · Desktop</button>
    <button data-role="admin"><span class="rc" style="background:var(--sa)"></span>Senior Admin · Desktop</button>
    <button data-role="caregiver"><span class="rc" style="background:var(--cg)"></span>Caregiver · Mobile</button>
  </div>
  <button onclick="resetDemo()" title="Reset all sample data to the original demo" style="background:#1b2836;color:#b7c5d6;border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin-left:8px">↺ Reset demo</button>
</div>

<!-- ============ DESKTOP ============ -->
<div id="desktop">
  <aside class="side">
    <div class="who">
      <div class="avatar" id="sideAvatar" style="background:var(--os)">DC</div>
      <div><div class="nm" id="sideName">Dana Cruz</div><div class="rl" id="sideRole">Office Staff</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot" id="footStatus">KodaRE — Property Management Platform<br>Prototype for team review · not live data</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="viewTitle">Dashboard</h1><div class="crumb" id="crumb">Overview</div></div>
      <div class="search"><span class="mag">⌕</span><input type="text" placeholder="Search properties, tickets, vendors…" oninput="globalSearch(this.value)"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<!-- ============ MOBILE ============ -->
<div id="mobile" class="hidden">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span>KodaRE</span><span>●●● ▮</span></div>
      <div id="mobileApp" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    </div>
  </div>
</div>

<div id="drawerRoot"></div>
<div id="toastRoot"></div>
<div id="authGate" class="hidden" style="position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:inherit">
  <div style="background:#fff;border-radius:14px;padding:32px;width:340px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.35)">
    <div style="font-size:19px;font-weight:800;margin-bottom:4px">KodaRE</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:18px">Sign in to your team's live workspace</div>
    <div class="field"><label class="f">Email</label><input type="email" id="authEmail" style="width:100%" placeholder="you@company.com"></div>
    <div class="field" style="margin-top:10px"><label class="f">Password</label><input type="password" id="authPassword" style="width:100%" placeholder="••••••••"></div>
    <div id="authError" style="color:var(--red,#c0392b);font-size:12.5px;margin-top:8px;min-height:16px"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="authSignIn()">Sign in</button>
  </div>
</div>

<!-- Supabase client (only loaded/used when config.js has real project values — see config.js) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
/* ===== Supabase live-data layer (Phase 1: Maintenance module only) =====
   Everything else in this file still runs on the original in-browser sample data
   until it gets its own migration phase. See kodare-web/supabase/schema.sql and
   GO_LIVE_INSTRUCTIONS.md for setup. */
const SUPA_CONFIGURED = typeof SUPABASE_URL!=='undefined' && SUPABASE_URL && !SUPABASE_URL.includes('YOUR_')
  && typeof SUPABASE_ANON_KEY!=='undefined' && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR_');
const sb = SUPA_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function daysAgoLabel(ts){const d=Math.max(0,Math.round((new Date()-new Date(ts))/864e5));return d===0?'today':d+'d ago';}
function logAge(l){return typeof l[2]==='number' ? (l[2]===0?'today':l[2]+'d ago') : daysAgoLabel(l[2]);}

function rowToTicket(row){
  const acts=(row.maintenance_ticket_activity||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  return {
    id: row.id, _backend:'supabase',
    prop: row.property_id, title: row.title, desc: row.description||'', notes: row.notes||'',
    urgency: row.urgency, status: row.status, svc: row.service_category, svctype: row.service_type,
    vendor: row.vendor, cost: row.cost!=null?Number(row.cost):null,
    invoice: row.invoice_number, invoiceFileUrl: row.invoice_file_url, invoiceFileName: row.invoice_file_name,
    invoiceTotal: row.invoice_total!=null?Number(row.invoice_total):null, payment: row.payment_status,
    reporter: row.reporter, created: new Date(row.created_at),
    log: acts.map(a=>[a.action, a.detail, a.created_at])
  };
}
async function dbUpdateTicket(id,patch){
  const {error}=await sb.from('maintenance_tickets').update(patch).eq('id',id);
  if(error){toast('Save failed: '+error.message);return false;}
  return true;
}
async function dbLogActivity(ticketId,action,detail){
  const {error}=await sb.from('maintenance_ticket_activity').insert({ticket_id:ticketId,action,detail});
  if(error)console.error('activity log failed',error);
}
function pushActivity(t,action,detail){
  if(t._backend==='supabase'){dbLogActivity(t.id,action,detail);t.log.push([action,detail,new Date().toISOString()]);}
  else t.log.push([action,detail,0]);
}
function rowToProperty(row){
  return {
    id:row.id, _backend:'supabase', name:row.name, addr:row.addr, own:row.own,
    beds:row.beds, bedrooms:row.bedrooms, bathrooms:row.bathrooms, sqft:row.sqft,
    yearBuilt:row.year_built, levels:row.levels, metro:row.metro, county:row.county,
    municipality:row.municipality, schoolDistrict:row.school_district, zoning:row.zoning,
    propertyType:row.property_type, typeStyle:row.type_style, constructionMaterial:row.construction_material,
    parkingType:row.parking_type, hoaCondo:row.hoa_condo, hoaFee:row.hoa_fee!=null?Number(row.hoa_fee):null,
    hoaAssocName:row.hoa_assoc_name, hoaAssocContact:row.hoa_assoc_contact, taxId:row.tax_id, mls:row.mls,
    operatingProgram:row.operating_program, houseManager:row.house_manager,
    llc:row.llc, buyerLLC:row.buyer_llc, purchaseDate:row.purchase_date, settlementDate:row.settlement_date,
    purchasePrice:row.purchase_price!=null?Number(row.purchase_price):null,
    totalBuyerCosts:row.total_buyer_costs!=null?Number(row.total_buyer_costs):null,
    loanInitial:row.loan_initial!=null?Number(row.loan_initial):null,
    loanRemaining:row.loan_remaining!=null?Number(row.loan_remaining):null,
    value:row.value!=null?Number(row.value):null,

function invoiceGroups(list){
  const map={};
  list.forEach(t=>{
    if(t.invoice&&t.invoiceTotal!=null){
      const k=t.invoice;
      if(!map[k])map[k]={invoice:k,total:t.invoiceTotal,sum:0,ids:[],url:t.invoiceFileUrl};
      map[k].sum+=(t.cost||0);
      map[k].ids.push(t.id);
    }
  });
  return Object.values(map).map(g=>Object.assign(g,{diff:Math.round((g.sum-g.total)*100)/100}));
}
function updatePayment(id,val){
  const t=TICKETS.find(x=>x.id===id);if(!t)return;
  if(val==='Ready for Payment'&&t.invoice&&t.invoiceTotal!=null){
    const group=invoiceGroups(TICKETS).find(g=>g.invoice===t.invoice);
    if(group&&Math.abs(group.diff)>0.01){
      const ok=confirm('Heads up: tickets attached to "'+group.invoice+'" total '+money(group.sum)+' but the invoice total is '+money(group.total)+' (off by '+money(Math.abs(group.diff))+'). Set to Ready for Payment anyway?');
      if(!ok)return;
    }
  }
  const prev=t.payment;t.payment=val;
  if(t._backend==='supabase'){
    dbUpdateTicket(id,{payment_status:val||null}).then(ok=>{if(!ok){t.payment=prev;refreshTickets();}});
    dbLogActivity(id,val||'Payment cleared','Updated from Maintenance table');
  } else saveState();
  toast(val?('Payment: '+val):'Payment cleared');refreshTickets();
}

function promptInvoiceTotal(){
  const raw=prompt('Invoice total for this file, as read by the platform (leave blank to skip the reconciliation check):','');
  if(raw==null||raw.trim()==='')return null;
  const n=Number(raw.trim());
  return isNaN(n)?null:n;
}
async function attachInvoiceFile(t,file,invoiceTotal){
  if(t._backend==='supabase'){
    const path=`${t.id}/${Date.now()}_${file.name}`;
    const {error:upErr}=await sb.storage.from('invoices').upload(path,file,{upsert:true});
    if(upErr){toast('Upload failed: '+upErr.message);return false;}
    const {data:signed}=await sb.storage.from('invoices').createSignedUrl(path,60*60*24*7);
    const url=signed?signed.signedUrl:null;
    t.invoice=file.name;t.invoiceFileUrl=url;t.invoiceFileName=file.name;t.payment='Match Proposed';
    t.invoiceTotal=(invoiceTotal!=null)?invoiceTotal:null;
    const ok=await dbUpdateTicket(t.id,{invoice_number:file.name,invoice_file_url:url,invoice_file_name:file.name,payment_status:'Match Proposed',invoice_total:(invoiceTotal!=null?invoiceTotal:null)});
    if(ok)dbLogActivity(t.id,'Invoice attached',file.name+(invoiceTotal!=null?' · total '+money(invoiceTotal):''));
    return ok;
  }
  let url=null;try{url=URL.createObjectURL(file);}catch(e){}
  t.invoice=file.name;
  t.invoiceFileUrl=url;
  t.invoiceFileName=file.name;
  t.payment='Match Proposed';
  t.invoiceTotal=(invoiceTotal!=null)?invoiceTotal:null;
  return true;
}

async function dropInvoiceOnSelected(ev){
  ev.preventDefault();ev.currentTarget.style.background='';

    if(p.own==='owned'&&leasedOnly.includes(t))return false;
    if(p.own==='leased'&&ownedOnly.includes(t))return false;
    return true;
  });
}

}
function uploadDoc(pid){
  const p=propById(pid);
  const typeSel=document.getElementById('docType_'+pid);
  const fileInp=document.getElementById('docFile_'+pid);
  const type=typeSel?typeSel.value:'Deed';
  const picked=(fileInp&&fileInp.files&&fileInp.files[0])?fileInp.files[0]:null;
  if(!picked){toast('Choose a file first');return;}
  if(!docTypesFor(p).includes(type)){toast(type+' doesn\'t apply to '+(p.own==='owned'?'an owned':'a leased')+' property like '+p.name);return;}
  let url=null;try{url=URL.createObjectURL(picked);}catch(e){}
  const rec={id:'d'+(++DOC_ID),prop:pid,type,file:picked.name,size:fmtBytes(picked.size),url,uploaded:new Date(today),status:'On file',note:''};
  {
    const applied=extractIntoProperty(p,type);
    rec.status='Extracted';
    rec.note=applied.length?('Auto-filled: '+applied.join(', ')+' — review and edit as needed.'):'No mapped fields for this document type in the prototype; filed for reference.';
    DOCS.push(rec);saveState();
    toast(applied.length?'Extracted from '+type+' — fields updated, review below':'Document filed');
  }
  document.getElementById('propTabBody').innerHTML=propDocs(p);
}
function updatePropField(pid,field,value,kind){
  const p=propById(pid);if(!p)return;
  const prev=p[field];
  if(kind==='number'){const v=value.trim();p[field]=v===''?null:(isNaN(Number(v))?p[field]:Number(v));}
  else{p[field]=value.trim()===''?null:value;}
  if(p._backend==='supabase'){
    const col=PROP_FIELD_TO_COLUMN[field];
    if(col){dbUpdateProperty(pid,{[col]:p[field]}).then(ok=>{if(!ok)p[field]=prev;});}
  } else saveState();
  toast('Updated — override saved');
}

function parseFilterDate(s){
  const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m)return null;
  const mo=+m[1],da=+m[2],yr=+m[3];
  if(mo<1||mo>12||da<1||da>31)return null;
  const d=new Date(yr,mo-1,da,0,0,0,0);
  return isNaN(d.getTime())?null:d;
}

function actualCompletionDate(t){const c=t.log.find(l=>l[0]==='Completed');if(!c)return null;const d=new Date(today);d.setDate(d.getDate()-c[2]);return d;}
function ticketRecon(t){const inMonthly=RECON.monthly.groups.some(g=>g.tickets.includes(t.id));const inWeekly=RECON.weekly.groups.some(g=>g.tickets.includes(t.id));
  if(inMonthly)return {label:'Matched — monthly',cls:'b-resolved'};
  if(inWeekly)return {label:'Matched — weekly (preliminary)',cls:'b-progress'};
  if(t.status==='Completed'||t.status==='Closed')return {label:'Pending reconciliation',cls:'b-new'};
  return {label:'—',cls:'b-closed'};}

    <div class="sectitle">Activity</div><div class="card"><div class="body"><ul class="timeline">${t.log.map(l=>`<li><span class="tdot"></span><div class="tt">${l[0]}</div><div class="tm">${l[1]} · ${logAge(l)}</div></li>`).join('')}</ul></div></div>`);
}
function ticketActions(t){const b=[];const vsel=`<select onchange="assignVendor('${t.id}',this.value)"><option value="">Assign vendor…</option>${VENDORS.map(v=>`<option value="${v.name}"${t.vendor===v.name?' selected':''}>${v.name} (${v.trade})</option>`).join('')}</select>`;
  if(t.status==='Open'){b.push(vsel);b.push(`<button class="btn amber sm" onclick="setStatus('${t.id}','In progress','Work started')">Start work</button>`);}
  else if(t.status==='In progress'){b.push(`<button class="btn green sm" onclick="completeTicket('${t.id}')">Mark completed</button>`);if(!t.vendor)b.push(vsel);}
  else if(t.status==='Completed'){b.push(`<button class="btn sm" onclick="closeTicket('${t.id}')">Close & reconcile</button>`);}
  else if(t.status==='Closed'){b.push(`<button class="btn sec sm" onclick="setStatus('${t.id}','Open','Re-opened')">Re-open</button>`);}
  return b.join('');}
function assignVendor(id,name){if(!name)return;const t=TICKETS.find(x=>x.id===id);if(!t)return;
  const prevVendor=t.vendor,prevStatus=t.status;
  t.vendor=name;if(t.status==='Open')t.status='In progress';
  pushActivity(t,'Assigned','Dispatched to '+name);
  if(t._backend==='supabase')dbUpdateTicket(id,{vendor:name,status:t.status}).then(ok=>{if(!ok){t.vendor=prevVendor;t.status=prevStatus;refresh(id);}});
  toast('Vendor assigned');refresh(id);}
function setStatus(id,s,note){const t=TICKETS.find(x=>x.id===id);if(!t)return;
  const prev=t.status;t.status=s;
  pushActivity(t,s,note||'');
  if(t._backend==='supabase')dbUpdateTicket(id,{status:s}).then(ok=>{if(!ok){t.status=prev;refresh(id);}});
  toast('Status → '+s);refresh(id);}
function completeTicket(id){const t=TICKETS.find(x=>x.id===id);if(!t)return;const c=prompt('Actual cost ($):',t.cost!=null?t.cost:'');if(c===null)return;
  const prevCost=t.cost,prevStatus=t.status;
  t.cost=Number(c)||0;t.status='Completed';
  pushActivity(t,'Completed','Work complete · '+money(t.cost));
  if(t._backend==='supabase')dbUpdateTicket(id,{cost:t.cost,status:'Completed'}).then(ok=>{if(!ok){t.cost=prevCost;t.status=prevStatus;refresh(id);}});
  toast('Marked completed');refresh(id);}
function closeTicket(id){const t=TICKETS.find(x=>x.id===id);if(!t)return;
  const prev=t.status;t.status='Closed';
  pushActivity(t,'Closed','Closed & queued for reconciliation');
  if(t._backend==='supabase')dbUpdateTicket(id,{status:'Closed'}).then(ok=>{if(!ok){t.status=prev;refresh(id);}});
  toast('Ticket closed');refresh(id);}

async function submitNewTicket(){
  const propEl=document.getElementById('nt_prop');
  const propId=propEl?propEl.value:'';
  const status=document.getElementById('nt_status').value||'Open';
  const createdRaw=(document.getElementById('nt_created').value||'').trim();
  const desc=(document.getElementById('nt_desc').value||'').trim();
  const urgency=document.getElementById('nt_urgency').value;
  const svc=document.getElementById('nt_svc').value;
  const svctype=document.getElementById('nt_svctype').value;
  const vendor=document.getElementById('nt_vendor').value;
  const costRaw=(document.getElementById('nt_cost').value||'').trim();
  const invoice=(document.getElementById('nt_invoice').value||'').trim();
  const payment=document.getElementById('nt_payment').value;
  const reporter=(document.getElementById('nt_reporter').value||'').trim()||STAFF.office.name;
  const notes=(document.getElementById('nt_notes').value||'').trim();
  const errEl=document.getElementById('nt_error');
  errEl.textContent='';
  if(!propId){errEl.textContent='Choose a property.';return;}
  if(!desc){errEl.textContent='Add a short description.';return;}
  let cost=null;
  if(costRaw!==''){const n=Number(costRaw);if(isNaN(n)){errEl.textContent='Cost must be a number.';return;}cost=n;}
  let created=createdRaw?new Date(createdRaw+'T00:00:00'):new Date();
  if(isNaN(created))created=new Date();
  const p=propById(propId);
  const title=desc.slice(0,60);

  if(p&&p._backend==='supabase'){
    const payload={property_id:propId,title,description:desc,notes,service_category:svc||null,service_type:svctype||null,urgency,status,vendor:vendor||null,cost,invoice_number:invoice||null,payment_status:payment||null,reporter,created_at:created.toISOString()};
    const {data,error}=await sb.from('maintenance_tickets').insert(payload).select().single();
    if(error){errEl.textContent='Could not create ticket: '+error.message;return;}
    await dbLogActivity(data.id,'Logged','Entered in maintenance tracker');
    const t=rowToTicket(Object.assign({},data,{maintenance_ticket_activity:[{action:'Logged',detail:'Entered in maintenance tracker',created_at:new Date().toISOString()}]}));
    TICKETS.unshift(t);
    closeDrawer();
    toast('Ticket '+t.id+' created');
    refreshTickets();
    return;
  }
  const t=mkTicket({prop:propId,title,desc,notes,svc:svc||null,svctype:svctype||null,urgency,status,vendor:vendor||null,cost,invoice:invoice||null,payment:payment||null,created,reporter,log:[['Logged','Entered in maintenance tracker',0]]});
  TICKETS.push(t);saveState();
  closeDrawer();
  toast('Ticket '+t.id+' created');
  refreshTickets();
}

        <button class="btn sec sm" onclick="addBulkGridRows(10)">+ Add 10 rows</button>
        <span id="bulkGridMsg" class="muted" style="font-size:12.5px"></span>
        <button class="btn" style="margin-left:auto" onclick="importBulkGrid()">Import all</button>
      </div>
    </div>
  </div>`;
}
function bulkGridTable(){
  return `<table style="border-collapse:collapse;min-width:1550px">
    <thead><tr>${BULK_TICKET_HEADERS.map(h=>`<th style="position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);padding:6px 8px;font-size:11.5px;text-align:left;white-space:nowrap;z-index:1">${h}</th>`).join('')}</tr></thead>
    <tbody>${BULK_GRID.map((row,r)=>`<tr>${row.map((val,c)=>`<td style="border:1px solid var(--line);padding:0"><input value="${esc(val)}" oninput="setBulkCell(${r},${c},this.value)" onpaste="bulkGridPaste(event,${r},${c})" style="width:130px;border:0;padding:6px 8px;font-size:12.5px;background:transparent"></td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}
function setBulkCell(r,c,val){if(BULK_GRID[r])BULK_GRID[r][c]=val;}
function bulkGridPaste(event,r,c){
  const text=(event.clipboardData||window.clipboardData).getData('text');
  if(!text||(!text.includes('\t')&&!text.includes('\n')))return; // single-cell paste: let the browser handle it natively
  event.preventDefault();
  const lines=text.replace(/\r/g,'').split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
  lines.forEach((line,ri)=>{
    while(!BULK_GRID[r+ri])BULK_GRID.push(BULK_TICKET_HEADERS.map(()=>''));
    const cells=line.split('\t');
    cells.forEach((cell,ci)=>{
      const col=c+ci;
      if(col<BULK_TICKET_HEADERS.length)BULK_GRID[r+ri][col]=cell.trim();
    });
  });
  document.getElementById('bulkGridWrap').innerHTML=bulkGridTable();
}
function addBulkGridRows(n){
  for(let i=0;i<n;i++)BULK_GRID.push(BULK_TICKET_HEADERS.map(()=>''));
  document.getElementById('bulkGridWrap').innerHTML=bulkGridTable();
}
function importBulkGrid(){
  const rows=BULK_GRID.map(row=>{
    const obj={};
    BULK_TICKET_HEADERS.forEach((h,i)=>{obj[h]=row[i];});
    return obj;
  }).filter(obj=>Object.values(obj).some(v=>String(v||'').trim()!==''));
  if(!rows.length){const m=document.getElementById('bulkGridMsg');if(m)m.textContent='Nothing to import yet — fill in at least one row.';return;}
  closeDrawer();
  processBulkTicketRows(rows);
}
const TICKET_UPLOAD_FIELD_MAP={property:'prop',propertyname:'prop',status:'status',created:'created',createddate:'created',datecreated:'created',date:'created',description:'desc',title:'desc',issue:'desc',priority:'urgency',urgency:'urgency',servicecategory:'svc',category:'svc',servicetype:'svctype',type:'svctype',vendor:'vendor',cost:'cost',estimatedcost:'cost',invoice:'invoice',invoicenumber:'invoice',payment:'payment',paymentstatus:'payment',reporter:'reporter',notes:'notes'};
function normHeaderKey(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function handleBulkUploadFile(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      processBulkTicketRows(rows);
    }catch(err){
      toast('Could not read that file: '+err.message);
    }finally{
      input.value='';
    }
  };
  reader.onerror=function(){toast('Could not read that file.');input.value='';};
  reader.readAsArrayBuffer(file);
}
async function processBulkTicketRows(rows){
  if(!rows||!rows.length){toast('That file has no rows to import.');return;}
  const plist=SUPA_CONFIGURED?PROPS.filter(p=>p._backend==='supabase'):PROPS;
  const STATUS_OPTS=['Open','In progress','Completed','Closed'];
  const URGENCY_OPTS=['Low','Urgent','Emergency'];
  const PAYMENT_OPTS=['Match Proposed','Ready for Payment','Paid'];
  const parsed=[],skipped=[];
  rows.forEach((row,i)=>{
    const f={};
    Object.keys(row).forEach(k=>{const mapped=TICKET_UPLOAD_FIELD_MAP[normHeaderKey(k)];if(mapped&&!(mapped in f))f[mapped]=row[k];});
    const rowNum=i+2;
    const propName=String(f.prop||'').trim();
    const desc=String(f.desc||'').trim();
    if(!propName){skipped.push('Row '+rowNum+': missing Property');return;}
    if(!desc){skipped.push('Row '+rowNum+': missing Description');return;}
    const prop=plist.find(p=>p.name.toLowerCase()===propName.toLowerCase());
    if(!prop){skipped.push('Row '+rowNum+': property "'+propName+'" not found');return;}
    let status=String(f.status||'').trim();
    status=STATUS_OPTS.find(s=>s.toLowerCase()===status.toLowerCase())||'Open';
    let urgency=String(f.urgency||'').trim();
    urgency=URGENCY_OPTS.find(u=>u.toLowerCase()===urgency.toLowerCase())||'Low';
    let payment=String(f.payment||'').trim();
    payment=PAYMENT_OPTS.find(p=>p.toLowerCase()===payment.toLowerCase())||null;
    let cost=null;
    if(f.cost!=null&&String(f.cost).trim()!==''){const n=Number(String(f.cost).replace(/[^0-9.\-]/g,''));if(!isNaN(n))cost=n;}
    let created=null;
    if(f.created){
      let d;
      if(f.created instanceof Date)d=f.created;
      else{const s=String(f.created).trim();d=/^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T00:00:00'):new Date(s);}
      if(!isNaN(d))created=d;
    }
    parsed.push({prop,status,urgency,svc:String(f.svc||'').trim()||null,svctype:String(f.svctype||'').trim()||null,vendor:String(f.vendor||'').trim()||null,cost,invoice:String(f.invoice||'').trim()||null,payment,reporter:String(f.reporter||'').trim()||STAFF.office.name,notes:String(f.notes||'').trim(),desc,title:desc.slice(0,60),created});
  });
  if(!parsed.length){alert('No rows could be imported.'+(skipped.length?'\n\n'+skipped.join('\n'):''));return;}
  let created=0;
  const liveRows=parsed.filter(r=>r.prop._backend==='supabase');
  const demoRows=parsed.filter(r=>r.prop._backend!=='supabase');
  if(liveRows.length){
    const payloads=liveRows.map(r=>{const payload={property_id:r.prop.id,title:r.title,description:r.desc,notes:r.notes,status:r.status,urgency:r.urgency,service_category:r.svc,service_type:r.svctype,vendor:r.vendor,cost:r.cost,invoice_number:r.invoice,payment_status:r.payment,reporter:r.reporter};if(r.created)payload.created_at=r.created.toISOString();return payload;});
    const {data,error}=await sb.from('maintenance_tickets').insert(payloads).select();
    if(error){toast('Bulk import failed: '+error.message);return;}
    for(const row of data){
      await dbLogActivity(row.id,'Logged','Entered via bulk upload');
      TICKETS.unshift(rowToTicket(Object.assign({},row,{maintenance_ticket_activity:[{action:'Logged',detail:'Entered via bulk upload',created_at:new Date().toISOString()}]})));
      created++;
    }
  }
  if(demoRows.length){
    demoRows.forEach(r=>{
      const t=mkTicket({prop:r.prop.id,title:r.title,desc:r.desc,notes:r.notes,svc:r.svc,svctype:r.svctype,urgency:r.urgency,status:r.status,vendor:r.vendor,cost:r.cost,invoice:r.invoice,payment:r.payment,reporter:r.reporter,created:r.created||new Date(today),log:[['Logged','Entered via bulk upload',0]]});
      TICKETS.push(t);
      created++;
    });
    saveState();
  }
  refreshTickets();
  let msg=created+' ticket'+(created===1?'':'s')+' imported.';
  if(skipped.length)msg+=' '+skipped.length+' row'+(skipped.length===1?'':'s')+' skipped.';
  toast(msg);
  if(skipped.length)alert('Skipped rows:\n\n'+skipped.join('\n'));
}

const LSKEY='kodare_proto_v03_r1';
function saveState(){try{const snap={PROPS,VENDORS,LEASES,RECON,TID,NOTES,NOTEID,DOCS,DOC_ID};if(!SUPA_CONFIGURED)snap.TICKETS=TICKETS;localStorage.setItem(LSKEY,JSON.stringify(snap));}catch(e){}}
function mergeById(defaults,saved,idKey){const map={};defaults.forEach(d=>map[d[idKey]]=Object.assign({},d));
  saved.forEach(s=>{const k=s[idKey];if(map[k])Object.assign(map[k],s);else map[k]=s;});
  return Object.values(map);}
function loadState(){try{const raw=localStorage.getItem(LSKEY);if(!raw)return false;const s=JSON.parse(raw);
  // Merge (rather than overwrite) so new sample properties/vendors/fields added later in the
  // prototype's source always show up, even if a browser has older saved state under this key.
  // Tickets are skipped entirely once live (SUPA_CONFIGURED) — they come from Supabase instead.
  if(!SUPA_CONFIGURED){
    const savedTickets=(s.TICKETS||[]).map(t=>Object.assign({},t,{created:new Date(t.created)}));
    const mergedTickets=mergeById(TICKETS,savedTickets,'id');TICKETS.length=0;mergedTickets.forEach(t=>TICKETS.push(t));
  }
  const mergedProps=mergeById(PROPS,s.PROPS||[],'id');PROPS.length=0;mergedProps.forEach(p=>PROPS.push(p));
  const mergedVendors=mergeById(VENDORS,s.VENDORS||[],'name');VENDORS.length=0;mergedVendors.forEach(v=>VENDORS.push(v));
  const savedLeases=(s.LEASES||[]).map(l=>Object.assign({},l,{next:l.next?new Date(l.next):l.next}));
  const mergedLeases=mergeById(LEASES,savedLeases,'id');LEASES.length=0;mergedLeases.forEach(l=>LEASES.push(l));
  const savedDocs=(s.DOCS||[]).map(x=>Object.assign({},x,{uploaded:new Date(x.uploaded)}));
  const mergedDocs=mergeById(DOCS,savedDocs,'id');DOCS.length=0;mergedDocs.forEach(x=>DOCS.push(x));
  if(s.DOC_ID)DOC_ID=s.DOC_ID;
  if(s.RECON){RECON.weekly=s.RECON.weekly;RECON.monthly=s.RECON.monthly;}if(s.NOTES)NOTES=s.NOTES;if(s.NOTEID)NOTEID=s.NOTEID;
  if(s.TID)TID=s.TID;return true;}catch(e){return false;}}

  if(s===0)body=`<div class="sectitle">Step 1 · Acquisition type</div><div class="row"><div class="card" style="flex:1;cursor:pointer;${d.own==='owned'?'box-shadow:0 0 0 2px var(--sys)':''}" onclick="obSet('own','owned')"><div class="body"><div style="font-size:26px">🏠</div><div class="b">Purchase (Owned)</div><div class="muted" style="font-size:12.5px">Flow A — buy & onboard. Held in an LLC.</div></div></div><div class="card" style="flex:1;cursor:pointer;${d.own==='leased'?'box-shadow:0 0 0 2px var(--ten)':''}" onclick="obSet('own','leased')"><div class="body"><div style="font-size:26px">📄</div><div class="b">Lease (Leased)</div><div class="muted" style="font-size:12.5px">Flow B — lease from a landlord.</div></div></div></div><div style="margin-top:18px">${d.own?`<button class="btn" onclick="obNext()">Continue →</button>`:`<button class="btn" disabled style="opacity:.5">Choose a type first</button>`}</div>`;
  else if(s===1)body=`<div class="sectitle">Step 2 · Basics</div><div class="field"><label class="f">Property name</label><input type="text" id="ob_name" value="${d.name||''}" placeholder="e.g. Sycamore House" style="width:100%"></div><div class="field"><label class="f">Address</label><input type="text" id="ob_addr" value="${d.addr||''}" placeholder="123 Sycamore St, City ST" style="width:100%"></div><div class="field"><label class="f">Beds</label><input type="text" id="ob_beds" value="${d.beds||''}" placeholder="e.g. 4" style="width:120px"></div><div style="display:flex;gap:10px"><button class="btn sec" onclick="obCapture(1);obBack()">← Back</button><button class="btn" onclick="obCapture(1);obNext()">Continue →</button></div>`;
  else if(s===2)body=`<div class="sectitle">Step 3 · ${d.own==='owned'?'Ownership':'Lease terms'}</div>${d.own==='owned'?`<div class="field"><label class="f">Holding LLC</label><input type="text" id="ob_llc" value="${d.llc||''}" placeholder="e.g. Sycamore Holdings LLC" style="width:100%"></div><div class="field"><label class="f">Purchase price ($)</label><input type="text" id="ob_val" value="${d.value||''}" placeholder="e.g. 350000" style="width:220px"></div>`:`<div class="field"><label class="f">Landlord</label><input type="text" id="ob_land" value="${d.landlord||''}" placeholder="e.g. Riverside Rentals" style="width:100%"></div><div class="field"><label class="f">Monthly rent ($)</label><input type="text" id="ob_rent" value="${d.rent||''}" placeholder="e.g. 3000" style="width:220px"></div>`}<div style="display:flex;gap:10px"><button class="btn sec" onclick="obCapture(2);obBack()">← Back</button><button class="btn" onclick="obCapture(2);obNext()">Continue →</button></div>`;
  else{const p=d;body=`<div class="sectitle">Step 4 · Review</div><div class="card"><div class="body"><div class="kv"><div class="k">Type</div><div class="b">${p.own==='owned'?'Owned (Flow A)':'Leased (Flow B)'}</div><div class="k">Name</div><div class="b">${p.name||'—'}</div><div class="k">Address</div><div>${p.addr||'—'}</div><div class="k">Beds</div><div>${p.beds||'—'}</div>${p.own==='owned'?`<div class="k">LLC</div><div>${p.llc||'—'}</div><div class="k">Value</div><div>${p.value?money(+p.value):'—'}</div>`:`<div class="k">Landlord</div><div>${p.landlord||'—'}</div><div class="k">Rent</div><div>${p.rent?money(+p.rent)+'/mo':'—'}</div>`}</div></div></div><div class="muted" style="font-size:12.5px;margin:10px 0">Created with status <b>Onboarding</b>.</div><div style="display:flex;gap:10px"><button class="btn sec" onclick="obBack()">← Back</button><button class="btn green" onclick="obCreate()">Create property ✓</button></div>`;}
  drawer(`<div style="flex:1"><div class="faint" style="font-size:12px">Onboard property · ${d.own==='owned'?'Flow A':d.own==='leased'?'Flow B':'new'}</div><div style="font-size:19px;font-weight:800">New property</div></div>`,prog+body);}
async function obCreate(){
  const d=OB.d;
  if(SUPA_CONFIGURED){
    const payload={name:d.name||'New Property',addr:d.addr||'',own:d.own,beds:parseInt(d.beds)||null};
    if(d.own==='owned'){payload.llc=d.llc||null;payload.value=parseInt(d.value)||null;}
    else{payload.landlord=d.landlord||null;payload.rent=parseInt(d.rent)||null;}
    const {data,error}=await sb.from('properties').insert(payload).select().single();
    if(error){toast('Could not onboard property: '+error.message);return;}
    const p=rowToProperty(data);
    p.status='Onboarding';p.health='amber';
    PROPS.push(p);
    if(d.own!=='owned'){
      const {data:leaseRow,error:leaseErr}=await sb.from('leases').insert({property_id:p.id,landlord:p.landlord,rent:p.rent,term:'12 mo',status:'Onboarding',escalated:false}).select().single();
      if(!leaseErr)LEASES.push(rowToLease(leaseRow));
    }
    closeDrawer();toast('Property onboarded: '+p.name);navigate('properties');
    return;
  }
  const p={id:'p'+Date.now(),name:d.name||'New Property',addr:d.addr||'',own:d.own,beds:parseInt(d.beds)||null,status:'Onboarding',health:'amber',compliance:null};if(d.own==='owned'){p.llc=d.llc||'—';p.value=parseInt(d.value)||null;p.rent=null;}else{p.landlord=d.landlord||'—';p.rent=parseInt(d.rent)||null;LEASES.push({id:p.id,prop:p.id,landlord:p.landlord,rent:p.rent,term:'12 mo',start:'—',end:'—',next:new Date(today),status:'Onboarding',escalated:false});}PROPS.push(p);saveState();closeDrawer();toast('Property onboarded: '+p.name);navigate('properties');}

/* ===== boot ===== */
document.getElementById('switch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setRole(b.dataset.role);});
loadState();computeHealth();setRole('office');
initLiveMode();

</script>
</body>
</html>
